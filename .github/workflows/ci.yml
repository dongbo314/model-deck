name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.os }} / Node 22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run smoke:stack
      - name: Verify Windows launcher exit propagation
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MODELDECK_HOME: ${{ runner.temp }}/Model Deck 测试
        run: |
          $env:MODELDECK_DASHBOARD_HOST = '0.0.0.0'
          cmd /d /c packaging\windows\start-modeldeck.cmd
          if ($LASTEXITCODE -eq 0) { throw 'Windows launcher did not propagate the expected failure.' }
      - run: node bin/modeldeck.mjs doctor --json
        env:
          MODELDECK_HOME: ${{ runner.temp }}/Model Deck 测试
      - run: npm run security:audit
      - run: npm run security:signatures

  repository-boundary:
    name: Repository boundary
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - run: node scripts/verify-release.mjs
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  source-archive:
    name: Source archive clean install
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run release:verify
      - run: npm run release:artifacts
      - name: Verify and exercise source archive
        shell: bash
        run: |
          cd release
          sha256sum --check SHA256SUMS
          cd ..
          mkdir "$RUNNER_TEMP/model-deck-source"
          tar -xzf release/model-deck-core-v*-source.tar.gz -C "$RUNNER_TEMP/model-deck-source" --strip-components=1
          cd "$RUNNER_TEMP/model-deck-source"
          npm ci
          npm run check
          npm run build
          npm run smoke:stack
