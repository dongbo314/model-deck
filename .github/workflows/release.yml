name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-core:
    name: Validate ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: Verify tag matches package version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run release:verify
      - run: npm run check
      - run: npm run build
      - run: npm run smoke:stack
      - run: npm run security:audit
      - run: npm run security:signatures

  validate-container:
    name: Validate Docker Compose / linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOCKER_BUILDKIT: "1"
      MODELDECK_IMAGE: model-deck-core:release-validation
      MODELDECK_MANAGEMENT_TOKEN: modeldeck-release-management-fixture
      MODELDECK_DASHBOARD_TOKEN: modeldeck-release-dashboard-fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - name: Verify tag matches package version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Prepare ignored container environment
        shell: bash
        run: |
          cp packaging/docker/modeldeck.env.example modeldeck.env
          printf '\nMODELDECK_MANAGEMENT_TOKEN=%s\nMODELDECK_DASHBOARD_TOKEN=%s\n' "$MODELDECK_MANAGEMENT_TOKEN" "$MODELDECK_DASHBOARD_TOKEN" >> modeldeck.env
          chmod 600 modeldeck.env
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build source image
        run: docker compose build --pull
      - name: Verify image runtime identity and health check
        shell: bash
        run: |
          test "$(docker image inspect "$MODELDECK_IMAGE" --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect "$MODELDECK_IMAGE" --format '{{json .Config.Healthcheck.Test}}')" != "null"
      - name: Start hardened container
        run: docker compose up --detach --wait --wait-timeout 120
      - name: Verify hardening and host-loopback publications
        shell: bash
        run: |
          container_id="$(docker compose ps --quiet model-deck)"
          test -n "$container_id"
          test "$(docker inspect "$container_id" --format '{{.Config.User}}')" = "node"
          test "$(docker inspect "$container_id" --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
          test "$(docker inspect "$container_id" --format '{{json .HostConfig.CapDrop}}')" = '["ALL"]'
          test "$(docker inspect "$container_id" --format '{{json .HostConfig.SecurityOpt}}')" = '["no-new-privileges:true"]'
          test "$(docker inspect "$container_id" --format '{{.HostConfig.PidsLimit}}')" = "128"
          test -n "$(docker inspect "$container_id" --format '{{index .HostConfig.Tmpfs "/tmp"}}')"
          test -n "$(docker inspect "$container_id" --format '{{index .HostConfig.Tmpfs "/app/.next/cache"}}')"
          test "$(docker inspect "$container_id" --format '{{range .Mounts}}{{if eq .Destination "/var/lib/modeldeck"}}{{.Type}}{{end}}{{end}}')" = "volume"
          test "$(docker inspect "$container_id" --format '{{(index (index .NetworkSettings.Ports "3000/tcp") 0).HostIp}}')" = "127.0.0.1"
          test "$(docker inspect "$container_id" --format '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostIp}}')" = "127.0.0.1"
          test "$(docker compose exec -T model-deck id -u)" != "0"
      - name: Exercise container stack
        run: npm run smoke:container -- create
      - name: Recreate container while preserving its volume
        shell: bash
        run: |
          docker compose rm --stop --force model-deck
          docker compose up --detach --wait --wait-timeout 120
      - name: Verify cross-container named-volume persistence
        run: npm run smoke:container -- verify
      - name: Verify graceful stop
        shell: bash
        run: |
          container_id="$(docker compose ps --quiet model-deck)"
          docker compose stop --timeout 15 model-deck
          test "$(docker inspect "$container_id" --format '{{.State.Running}}')" = "false"
          test "$(docker inspect "$container_id" --format '{{.State.ExitCode}}')" = "0"
          test "$(docker inspect "$container_id" --format '{{.State.OOMKilled}}')" = "false"
      - name: Show container logs
        if: always()
        continue-on-error: true
        run: docker compose logs --no-color model-deck
      - name: Remove test container and volume
        if: always()
        continue-on-error: true
        run: docker compose down --volumes --remove-orphans

  publish-container:
    name: Publish Docker Hub / linux-amd64
    needs: [validate-core, validate-container]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    env:
      DOCKER_BUILDKIT: "1"
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      IMAGE: docker.io/${{ vars.DOCKERHUB_IMAGE }}
      MODELDECK_MANAGEMENT_TOKEN: modeldeck-published-management-fixture
      MODELDECK_DASHBOARD_TOKEN: modeldeck-published-dashboard-fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - name: Verify configured publication target
        id: image
        shell: bash
        run: |
          test "$DOCKERHUB_USERNAME" = "esofk"
          test "$IMAGE" = "docker.io/esofk/model-deck"
          printf 'name=%s\n' "$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
      - name: Build and push published image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=modeldeck-release-amd64
          cache-to: type=gha,mode=max,scope=modeldeck-release-amd64
          provenance: mode=max
          sbom: true
      - name: Select immutable registry artifact
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          test -n "$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          printf 'MODELDECK_IMAGE=%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_ENV"
      - name: Prepare ignored container environment
        shell: bash
        run: |
          cp packaging/docker/modeldeck.env.example modeldeck.env
          printf '\nMODELDECK_MANAGEMENT_TOKEN=%s\nMODELDECK_DASHBOARD_TOKEN=%s\n' "$MODELDECK_MANAGEMENT_TOKEN" "$MODELDECK_DASHBOARD_TOKEN" >> modeldeck.env
          chmod 600 modeldeck.env
      - name: Pull immutable registry artifact
        run: docker compose pull model-deck
      - name: Verify pulled image identity
        shell: bash
        run: |
          test "$(docker image inspect "$MODELDECK_IMAGE" --format '{{.Architecture}}')" = "amd64"
          test "$(docker image inspect "$MODELDECK_IMAGE" --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect "$MODELDECK_IMAGE" --format '{{json .Config.Healthcheck.Test}}')" != "null"
      - name: Start published image with hardened profile
        run: docker compose up --no-build --detach --wait --wait-timeout 120
      - name: Verify published container hardening
        shell: bash
        run: |
          container_id="$(docker compose ps --quiet model-deck)"
          test -n "$container_id"
          test "$(docker inspect "$container_id" --format '{{.Config.User}}')" = "node"
          test "$(docker inspect "$container_id" --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
          test "$(docker inspect "$container_id" --format '{{json .HostConfig.CapDrop}}')" = '["ALL"]'
          test "$(docker inspect "$container_id" --format '{{json .HostConfig.SecurityOpt}}')" = '["no-new-privileges:true"]'
          test "$(docker inspect "$container_id" --format '{{.HostConfig.PidsLimit}}')" = "128"
          test -n "$(docker inspect "$container_id" --format '{{index .HostConfig.Tmpfs "/tmp"}}')"
          test -n "$(docker inspect "$container_id" --format '{{index .HostConfig.Tmpfs "/app/.next/cache"}}')"
          test "$(docker inspect "$container_id" --format '{{range .Mounts}}{{if eq .Destination "/var/lib/modeldeck"}}{{.Type}}{{end}}{{end}}')" = "volume"
          test "$(docker inspect "$container_id" --format '{{(index (index .NetworkSettings.Ports "3000/tcp") 0).HostIp}}')" = "127.0.0.1"
          test "$(docker inspect "$container_id" --format '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostIp}}')" = "127.0.0.1"
          test "$(docker compose exec -T model-deck id -u)" != "0"
      - name: Exercise published container stack
        run: npm run smoke:container -- create
      - name: Recreate published container while preserving its volume
        shell: bash
        run: |
          docker compose rm --stop --force model-deck
          docker compose up --no-build --detach --wait --wait-timeout 120
      - name: Verify published-image volume persistence
        run: npm run smoke:container -- verify
      - name: Verify published-image graceful stop
        shell: bash
        run: |
          container_id="$(docker compose ps --quiet model-deck)"
          docker compose stop --timeout 15 model-deck
          test "$(docker inspect "$container_id" --format '{{.State.Running}}')" = "false"
          test "$(docker inspect "$container_id" --format '{{.State.ExitCode}}')" = "0"
          test "$(docker inspect "$container_id" --format '{{.State.OOMKilled}}')" = "false"
      - name: Promote verified digest to alpha
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p "require('./package.json').version")"
          docker buildx imagetools create --tag "$IMAGE:alpha" "$IMAGE@$DIGEST"
          for reference in "$IMAGE:$version" "$IMAGE:alpha"; do
            resolved=""
            for attempt in {1..12}; do
              resolved="$(docker buildx imagetools inspect "$reference" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)"
              test "$resolved" = "$DIGEST" && break
              sleep 5
            done
            test "$resolved" = "$DIGEST"
          done
      - name: Show published container logs
        if: always()
        continue-on-error: true
        run: docker compose logs --no-color model-deck
      - name: Remove published test container and volume
        if: always()
        continue-on-error: true
        run: docker compose down --volumes --remove-orphans

  publish-source:
    name: Publish source preview
    needs: [validate-core, validate-container, publish-container]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MODELDECK_CONTAINER_DIGEST: ${{ needs.publish-container.outputs.digest }}
      MODELDECK_CONTAINER_IMAGE: ${{ needs.publish-container.outputs.image }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run release:verify
      - run: npm run release:artifacts
      - run: npm run release:artifacts:verify
      - name: Verify source archive
        shell: bash
        run: |
          cd release
          sha256sum --check SHA256SUMS
          cd ..
          mkdir "$RUNNER_TEMP/model-deck-source"
          tar -xzf release/model-deck-core-v*-source.tar.gz -C "$RUNNER_TEMP/model-deck-source" --strip-components=1
          cd "$RUNNER_TEMP/model-deck-source"
          npm ci
          npm run check
          npm run build
          npm run smoke:stack
      - name: Create GitHub prerelease
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --verify-tag
          --prerelease
          --title "Model Deck Core $GITHUB_REF_NAME"
          --generate-notes
